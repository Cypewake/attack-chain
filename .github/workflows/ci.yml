# attack-chain 持续集成：跑单元测试 + 示例链全流程冒烟
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 单元测试
        run: python -m pytest tests/ -v

      - name: 示例链冒烟（渲染 + 报告 + JSON 全流程）
        run: |
          python -m attackchain --input examples/vulnstack8-chain.yaml --out /tmp/smoke --json /tmp/smoke/result.json
          test -f /tmp/smoke/report.md
          test -f /tmp/smoke/result.json
          test -f /tmp/smoke/attack-chain.svg
